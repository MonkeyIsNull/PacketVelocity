name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Note: CI never runs live packet capture (that needs root and a real NIC).
# It builds the default (hermetic, no-RistrettoDB) binary and runs the offline
# test suite, which replays synthetic packets through the capture pipeline.

jobs:
  build-and-test:
    name: Build + offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout PacketVelocity
        uses: actions/checkout@v4
        with:
          path: PacketVelocity

      # VelocityFilterMachine is a required build dependency; PacketVelocity
      # expects it at ../VelocityFilterMachine.
      - name: Checkout VelocityFilterMachine
        uses: actions/checkout@v4
        with:
          repository: MonkeyIsNull/VelocityFilterMachine
          path: VelocityFilterMachine

      - name: Build VelocityFilterMachine (libvfm.a)
        working-directory: VelocityFilterMachine
        run: make libvfm.a

      - name: Build PacketVelocity (default, hermetic - no RistrettoDB)
        working-directory: PacketVelocity
        run: make

      - name: Verify the default build pulls in no RistrettoDB code
        working-directory: PacketVelocity
        run: |
          if nm packetvelocity | grep -i ristretto; then
            echo "ERROR: default build references RistrettoDB symbols" >&2
            exit 1
          fi
          echo "OK: default build is free of RistrettoDB symbols"

      - name: Smoke-test the CLI (no capture)
        working-directory: PacketVelocity
        run: |
          ./packetvelocity -V
          ./packetvelocity --help

      - name: Run offline test suite (no root, no live capture)
        working-directory: PacketVelocity
        run: make test

      - name: Build bundled examples
        working-directory: PacketVelocity
        run: make examples

  # Opt-in RistrettoDB V2 backend: REQUIRED job. The output layer has been
  # migrated to the RistrettoDB V2 append-only table API, so RISTRETTO=1 must
  # build, link, and pass the offline sink round-trip tests on both platforms -
  # both the per-packet sink (test_ristretto) and the per-flow sink
  # (test_ristretto_flow).
  ristretto-backend:
    name: RISTRETTO=1 build + link + sink tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout PacketVelocity
        uses: actions/checkout@v4
        with:
          path: PacketVelocity

      - name: Checkout VelocityFilterMachine
        uses: actions/checkout@v4
        with:
          repository: MonkeyIsNull/VelocityFilterMachine
          path: VelocityFilterMachine

      - name: Checkout RistrettoDB
        uses: actions/checkout@v4
        with:
          repository: MonkeyIsNull/RistrettoDB
          path: RistrettoDB

      - name: Build VelocityFilterMachine (libvfm.a)
        working-directory: VelocityFilterMachine
        run: make libvfm.a

      - name: Build RistrettoDB (static lib)
        working-directory: RistrettoDB
        run: make static

      - name: Build PacketVelocity with RISTRETTO=1 (build + link)
        working-directory: PacketVelocity
        run: make RISTRETTO=1

      - name: Verify the RISTRETTO=1 build actually linked RistrettoDB
        working-directory: PacketVelocity
        run: |
          if ! nm packetvelocity | grep -qi ristretto_table_create; then
            echo "ERROR: RISTRETTO=1 build did not link RistrettoDB" >&2
            exit 1
          fi
          echo "OK: RISTRETTO=1 build links the RistrettoDB V2 API"

      # `make RISTRETTO=1 test` builds and runs BOTH RistrettoDB V2 sink tests:
      # the per-packet round-trip (test_ristretto) and the per-flow round-trip
      # (test_ristretto_flow, which replays multiple packets across 3 flows -
      # incl. IPv6 and expiry-vs-shutdown emission - and verifies the flows
      # table read-back).
      - name: Run offline tests incl. both RistrettoDB V2 sink round-trips
        working-directory: PacketVelocity
        run: make RISTRETTO=1 test

  # Benchmark build-check + tiny smoke. This is NOT a perf-gating job: it imposes
  # NO throughput thresholds (perf flakes across runners). It only proves the
  # `make bench` target keeps COMPILING and RUNNING in BOTH build modes so it
  # cannot silently rot. Real perf numbers are produced by `make bench` on real
  # hardware (see BENCHMARKS.md), never in CI and never under emulation.
  bench-smoke:
    name: bench compiles + tiny smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout PacketVelocity
        uses: actions/checkout@v4
        with:
          path: PacketVelocity

      - name: Checkout VelocityFilterMachine
        uses: actions/checkout@v4
        with:
          repository: MonkeyIsNull/VelocityFilterMachine
          path: VelocityFilterMachine

      - name: Checkout RistrettoDB
        uses: actions/checkout@v4
        with:
          repository: MonkeyIsNull/RistrettoDB
          path: RistrettoDB

      - name: Build VelocityFilterMachine (libvfm.a)
        working-directory: VelocityFilterMachine
        run: make libvfm.a

      - name: Build RistrettoDB (static lib)
        working-directory: RistrettoDB
        run: make static

      # Default (hermetic) build: stages a-c + stdout, ZERO RistrettoDB symbols.
      - name: Default bench - compile + tiny smoke (BENCH_QUICK=1)
        working-directory: PacketVelocity
        run: make bench BENCH_QUICK=1

      - name: Verify the default bench binary pulls in no RistrettoDB code
        working-directory: PacketVelocity
        run: |
          if nm bench/bench_pipeline | grep -i ristretto; then
            echo "ERROR: default bench references RistrettoDB symbols" >&2
            exit 1
          fi
          echo "OK: default bench is free of RistrettoDB symbols"

      # RISTRETTO=1 build: all six stages incl. both RistrettoDB V2 sinks.
      - name: RISTRETTO=1 bench - compile + tiny smoke (BENCH_QUICK=1)
        working-directory: PacketVelocity
        run: make clean && make bench RISTRETTO=1 BENCH_QUICK=1
